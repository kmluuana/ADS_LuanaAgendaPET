services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: petshop123
      POSTGRES_DB: petshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petshop -d petshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./pet-shop-api
    env_file:
      - ./pet-shop-api/.env
    environment:
      DATABASE_URL: postgresql://petshop:petshop123@postgres:5432/petshop
      PORT: "3333"
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./pet-shop-web
    env_file:
      - ./pet-shop-web/.env
    environment:
      API_PROXY_TARGET: http://api:3333
      # The API loads its own signing secret.
      JWT_SECRET: ""
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
